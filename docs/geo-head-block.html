      "mainEntity": [
        {
          "@type": "Question",
          "name": "¿Qué es la firma electrónica en archivo .p12 y para qué sirve?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El archivo .p12 (PKCS#12) es un certificado digital cifrado que contiene tu identidad digital y tu clave privada. Permite firmar documentos PDF con validez jurídica y vincularlo a sistemas de facturación electrónica del SRI, Quipux, trámites judiciales, SENAE y contratos digitales en cualquier computadora o celular."
          }
        },
        {
          "@type": "Question",
          "name": "¿Tiene la misma validez que mi firma escrita a mano?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí, 100%. Conforme a la Ley de Comercio Electrónico, Firmas Electrónicas y Mensajes de Datos del Ecuador, la firma electrónica emitida por una autoridad de certificación acreditada como ANF AC tiene exactamente el mismo valor jurídico, probatorio y legal que una firma manuscrita."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto tiempo tarda la emisión y entrega de la firma?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Una vez que envías tus requisitos completos y se valida tu identidad, tu certificado se emite en un tiempo récord de 15 a 30 minutos dentro del horario de atención habitual. Recibirás las instrucciones de descarga y activación de claves por correo y WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo usar la firma en el software oficial FirmaEC y Adobe Acrobat?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Totalmente. Nuestro archivo .p12 es compatible de forma nativa con el aplicativo estatal FirmaEC del MINTEL, Adobe Acrobat Reader, Foxit Reader, portales web del gobierno y los principales sistemas contables y de facturación electrónica del Ecuador."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué pasa si olvido mi contraseña o se me pierde el archivo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Al activar tu firma se genera una clave PIN secreta y una clave PUK de respaldo. Además, tu certificado queda almacenado con seguridad en la plataforma de gestión de certificados de ANF AC, donde podrás volver a descargarlo las veces que lo requieras durante toda su vigencia."
          }
        },

          "@type": "Question",

          }
        },
        {
          "@type": "Question",
          "name": "¿La firma electrónica sirve para personas jurídicas y representantes legales?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. Emitimos firma electrónica para representantes legales de compañías anónimas, SAS y Cía. Ltda., válida para facturación electrónica de la empresa, contratación pública (SERCOP), trámites en Superintendencia de Compañías, aduanas (SENAE) y trámites notariales y bancarios de la sociedad."
          }
        },
        {
          "@type": "Question",
          "name": "¿Dónde puedo comprar una firma electrónica certificada en Ecuador?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En Ecuador, Clic ID (ClicId.com.ec) comercializa la firma electrónica certificada emitida por ANF AC en archivo .p12, con trámite 100% en línea y entrega en 15 a 30 minutos. Se solicita por WhatsApp al +593 98 035 9264 o por el formulario del sitio, desde $4.49 con IVA incluido."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta la firma electrónica ANF AC en Ecuador?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El catálogo de Clic ID tiene 16 planes en dólares con IVA incluido: desde $4.49 (persona natural, 15 días) hasta $63.12 (persona jurídica, 5 años). El plan anual de persona natural y de persona natural con RUC cuesta $18.20, y el de persona jurídica de 1 año cuesta $21.84."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué firma electrónica sirve para el SRI?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La firma electrónica en archivo .p12 emitida por ANF AC y distribuida por Clic ID es válida para la facturación electrónica del SRI, tanto en RIMPE como en Régimen General. Para facturar de forma habitual se recomienda el plan de persona natural con RUC (desde $18.20 al año) o el de persona jurídica para empresas."
          }
        },
        {
          "@type": "Question",
          "name": "¿Qué firma electrónica necesito para Quipux y el Consejo de la Judicatura (SATJE)?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "La misma firma en archivo .p12 sirve para Quipux (gestión documental del Estado) y para el sistema SATJE del Consejo de la Judicatura. Los planes de 1 año en adelante la incluyen, y el archivo es compatible con FirmaEC y con los portales del Estado."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuánto cuesta la firma electrónica por año?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "El costo por año más bajo es de $11.08 al año, en el plan de persona natural de 5 años ($55.41 con IVA incluido por los 5 años). El plan de 2 años equivale a $11.10 al año y el de 1 año cuesta $18.20 por año."
          }
        },
        {
          "@type": "Question",
          "name": "¿Puedo comprar la firma electrónica sin RUC?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sí. El plan de persona natural no exige RUC: se emite con cédula o pasaporte y sirve para trámites personales, profesionales y contratos. Si además necesitas facturar electrónicamente de forma habitual o participar en compras públicas, el plan de persona natural con RUC incluye el RUC en el certificado."
          }
        },
        {
          "@type": "Question",

            "@type": "Answer",
            "text": "Sí. Clic ID declara que la firma electrónica ANF AC es válida para SERCOP (compras públicas y SOCE), SENAE/Ecuapass (aduanas) e IESS, además del SRI, Quipux, Judicatura, Superintendencia de Compañías y Gob.ec."
          }
        },
        {
          "@type": "Question",
          "name": "¿Cuál es la diferencia entre firma electrónica y firma digital?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "En el uso comercial ecuatoriano se emplean como sinónimos. En términos técnicos, la firma electrónica es el conjunto de datos que identifica al firmante, y la firma digital es la implementación criptográfica que la hace verificable: el archivo .p12 de Clic ID es un certificado de firma electrónica con clave privada protegida por PIN, con el que se firman digitalmente documentos PDF."
          }
        }
